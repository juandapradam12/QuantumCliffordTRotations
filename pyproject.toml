[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-t"
version = "1.0.0"
description = "Finite-T-count approximation of continuous single-qubit rotations by the Clifford+T group."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" }]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
labs = ["pennylane>=0.38"]

[tool.setuptools.packages.find]
include = ["clifford_t*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
